name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  NODE_VERSION: 22.16.0

jobs:
  quality:
    name: Kalite kapıları (lint/type/unit/build/E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit testler
        run: npm run test:unit

      - name: Asset bütünlüğü (56/56 SHA-256)
        run: npm run verify:assets

      - name: Production build
        run: npm run build

      - name: Playwright Chromium + sistem bağımlılıkları
        run: npx playwright install --with-deps chromium

      # Video metadata testleri H.264 gerektirir; Playwright Chromium'da codec
      # yoktur. Branded Chrome kurulur; kurulamazsa CI AÇIKÇA başarısız olur
      # (video testleri sessizce skip edilmez).
      - name: Branded Chrome (video H.264 testleri için)
        run: npx playwright install chrome

      - name: E2E testler (functional)
        run: npm run test:e2e

      - name: Test raporu (yalnızca başarısızlıkta)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  visual:
    name: Görsel regresyon (repo golden'larına karşı)
    # Golden'lar macOS üzerinde üretildi; farklı OS font rasterizer'ı
    # antialias'ı belgeli eşiklerin ötesine taşıyacağından macOS runner şart.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Playwright Chromium
        run: npx playwright install chromium

      - name: Preview server
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4173/ >/dev/null || { echo "preview açılamadı"; exit 1; }

      # Kaynak canlı site CI'da yeniden scrape EDİLMEZ; repodaki onaylı
      # golden'lar tek referanstır. Eşikler scripts/ci-visual-check.mjs içinde
      # belgelidir; golden güncelleme ayrı ve bilinçli bir işlemdir.
      - name: Görsel regresyon kapısı
        run: node scripts/ci-visual-check.mjs --base http://localhost:4173 --out ci-visual-out

      - name: Görsel çıktılar (yalnızca başarısızlıkta)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-visual-captures
          path: ci-visual-out/
          retention-days: 7

  windows-relay:
    name: Windows relay (parse / birim testleri / dry-run)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # relay.ps1 ve preflight.ps1 gercek Windows PowerShell 5.1 parser'i ile
      # dogrulanir; sozdizimi hatasi CI'yi acikca dusurur.
      - name: PowerShell 5.1 sozdizimi
        shell: powershell
        run: |
          $files = @('tools\windows-camera-relay\relay.ps1',
                     'tools\windows-camera-relay\preflight.ps1',
                     'tests\windows\relay-config.tests.ps1')
          $bad = 0
          foreach ($f in $files) {
            $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$e) | Out-Null
            if ($e -and $e.Count -gt 0) { Write-Output "FAIL $f : $($e[0].Message)"; $bad++ }
            else { Write-Output "OK   $f" }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Batch dosyalari mevcut
        shell: powershell
        run: |
          $need = @('install.cmd','uninstall.cmd','start.cmd','stop.cmd','status.cmd','preflight.cmd','config.env.example','README.md')
          $miss = @($need | Where-Object { -not (Test-Path "tools\windows-camera-relay\$_") })
          if ($miss.Count) { Write-Output "eksik: $($miss -join ', ')"; exit 1 }
          Write-Output "$($need.Count) dosya mevcut"

      - name: Config parser birim testleri
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\relay-config.tests.ps1

      # Dry-run: hicbir scheduled task/registry/firewall degisikligi yapmaz.
      - name: install/uninstall dry-run
        shell: cmd
        run: |
          call tools\windows-camera-relay\install.cmd /dryrun || exit /b 1
          call tools\windows-camera-relay\uninstall.cmd /dryrun || exit /b 1

      - name: Kurulum sonrasi sistem degisikligi olmadigini dogrula
        shell: powershell
        run: |
          # schtasks gorev yoksa stderr'e yazar; PowerShell bunu NativeCommandError
          # sayar. cmd icinde calistirip yalnizca exit koduna bakiyoruz.
          cmd /c "schtasks /Query /TN SucculluKameraRelay >nul 2>&1"
          if ($LASTEXITCODE -eq 0) { Write-Output 'HATA: dry-run gorev olusturmus'; exit 1 }
          Write-Output 'OK: scheduled task olusturulmadi'
